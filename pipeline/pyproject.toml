[project]
name = "motion-lyrics-pipeline"
version = "1.0.0"
description = "Audio analysis and lyric alignment for motion-lyrics"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "numpy>=1.26,<2.3",
  "soundfile>=0.12",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "demucs==4.0.1",
  "uroman>=1.3.1",
  "faster-whisper>=1.1",
  "opencv-python-headless>=4.10",
  "langcodes>=3.4",
  "pillow>=10",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8"]
